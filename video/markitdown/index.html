<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../fonts/Pretendard-Regular.otf);font-weight:400}
@font-face{font-family:P;src:url(../fonts/Pretendard-Bold.otf);font-weight:700}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1020}
body{font-family:P,'WenQuanYi Zen Hei',sans-serif;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(1200px 900px at 20% 10%,#2a1b6e 0%,transparent 60%),radial-gradient(1000px 900px at 90% 90%,#0d4d57 0%,transparent 55%),#0b1020;overflow:hidden}
#bar{position:absolute;left:60px;right:60px;top:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.15)}
#bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7c5cff,#22d3a6);width:0}
.scene{position:absolute;inset:0;padding:0 70px;display:none}
/* 인스타 릴스 UI가 가리는 하단·우측을 피해 y 200~1480, x 70~930 안에 둔다 */
.safe{position:absolute;left:70px;right:150px;top:190px;bottom:600px;display:flex;flex-direction:column;justify-content:center;gap:34px}
[data-s]{opacity:0}
.kick{font-size:44px;font-weight:700;color:#22d3a6;letter-spacing:.02em}
.h1{font-size:92px;line-height:1.22;font-weight:700;white-space:pre-line;letter-spacing:-.02em}
.h1 em{font-style:normal;color:#ff6b81}
.cap{font-size:60px;line-height:1.3;font-weight:700;white-space:pre-line}
.cap small{display:block;font-size:44px;color:#22d3a6;margin-bottom:8px}
.sub{font-size:48px;color:#c9c9e8}
.big{font-size:150px;line-height:1.05;font-weight:700;letter-spacing:-.04em;background:linear-gradient(90deg,#9b8cff,#22d3a6);-webkit-background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:18px}
.chip{font-size:44px;font-weight:700;padding:16px 30px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22)}
.chip.a{background:rgba(124,92,255,.35);border-color:#9b8cff}
.card{border-radius:36px;background:#fff;color:#222;padding:44px 48px}
.card .lab{font-size:36px;color:#888;margin-bottom:22px;font-weight:700}
.plain{font-family:'DejaVu Sans Mono','WenQuanYi Zen Hei',monospace;font-size:42px;line-height:1.5;white-space:pre}
.plain .cell{color:#e0334c;font-weight:700}
.term{border-radius:30px;background:#0e1117;border:2px solid #2c3446;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.term .top{height:64px;background:#1a2030;display:flex;align-items:center;gap:14px;padding:0 26px}
.term .top i{width:22px;height:22px;border-radius:50%;display:block}
.term .body{padding:34px 36px;font-family:'DejaVu Sans Mono','WenQuanYi Zen Hei',monospace;font-size:41px;line-height:1.55;min-height:300px;white-space:pre;color:#d7e0f5}
.term .prompt{color:#22d3a6}.term .hl{color:#ffd166}.term .dim{color:#7d8aa8}
.cursor{display:inline-block;width:.55em;height:1.05em;background:#d7e0f5;vertical-align:-.15em}
.badge{align-self:flex-start;font-size:38px;font-weight:700;padding:10px 26px;border-radius:14px;background:#22d3a6;color:#062b25}
.steps{display:flex;flex-direction:column;gap:22px}
.step{font-size:68px;font-weight:700;display:flex;align-items:center;gap:26px}
.step b{width:96px;height:96px;border-radius:50%;background:#7c5cff;display:flex;align-items:center;justify-content:center;font-size:56px;flex:none}
.kw{display:inline-block;font-size:150px;font-weight:700;padding:10px 54px 24px;border-radius:44px;background:linear-gradient(135deg,#7c5cff,#22d3a6);color:#fff;align-self:flex-start;transform-origin:left center}
.note{font-size:40px;color:#c9c9e8}
</style></head>
<body><div id="stage"><div id="bar"><i></i></div></div>
<script>
const SC=[[0,6],[6,12],[12,22],[22,28.5],[28.5,37],[37,42.5],[42.5,50.5]]; // 장면 구간(초)
const END=50.5;
const TX={
ko:{
 s1:{k:'혹시 이런 적 있나요?',h:'AI한테 문서를 넣었는데\n<em>글자가 다 깨졌죠?</em>'},
 s2:{lab:'복사 → 붙여넣기 하면',cap:'표는 한 줄씩 흩어지고\n구조가 다 사라져요'},
 s3:{k:'그래서 쓰는 도구',sub:'Microsoft 오픈소스',chips:['★ 189.9k (2026.10)','MIT 라이선스','Python'],cap:'파일을 AI가 읽기 좋은\n마크다운으로 바꿔줘요'},
 s4:{k:'기능 1',cap:'설치는 명령어 한 줄',cmd:"pip install 'markitdown[all]'"},
 s5:{k:'기능 2',cap:'워드·PDF·PPT·엑셀을 한 줄로',cmd:'markitdown report_ko.docx',badge:'실제 실행 결과'},
 s6:{k:'기능 3',cap:'이미지 OCR · 음성 인식 · 유튜브 링크까지',chips:['PDF','Word','PowerPoint','Excel','이미지 (OCR)','오디오 (음성 인식)','YouTube 링크','HTML · CSV · JSON','ZIP · EPub']},
 s7:{k:'깃허브 주소가 필요하면',steps:['먼저 팔로우','이 영상에 댓글로','DM으로 받기'],kw:'링크',note:'※ 팔로우 전이면 메시지 요청함을 확인하세요'}},
en:{
 s1:{k:'Ever done this?',h:'You pasted a document into AI…\n<em>and it came out garbled?</em>'},
 s2:{lab:'Copy → paste gives you',cap:'Tables fall apart\nand the structure is gone'},
 s3:{k:'The tool for that',sub:'Open source from Microsoft',chips:['★ 189.9k (Oct 2026)','MIT license','Python'],cap:'Turns your files into\nLLM-ready Markdown'},
 s4:{k:'Feature 1',cap:'Install with one command',cmd:"pip install 'markitdown[all]'"},
 s5:{k:'Feature 2',cap:'Word, PDF, PPT, Excel — one line',cmd:'markitdown report_en.docx',badge:'Real output'},
 s6:{k:'Feature 3',cap:'Image OCR · audio transcription · YouTube links',chips:['PDF','Word','PowerPoint','Excel','Images (OCR)','Audio (transcription)','YouTube links','HTML · CSV · JSON','ZIP · EPub']},
 s7:{k:'Want the GitHub link?',steps:['Follow first','Comment on this video','Get it in your DMs'],kw:'link',note:"※ Not following yet? Check your message requests"}}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let LANG='ko',DEMO={};
function init(lang,demo){
 LANG=lang;DEMO=demo;const t=TX[lang],st=document.getElementById('stage');
 st.querySelectorAll('.scene').forEach(e=>e.remove());
 const sc=(i,html)=>{const d=document.createElement('div');d.className='scene';d.id='sc'+i;d.innerHTML='<div class="safe">'+html+'</div>';st.appendChild(d)};
 const a=(s,d=.5)=>`data-s="${s}" data-d="${d}"`;
 // 1 훅
 sc(1,`<div class="kick" ${a(0)}>${t.s1.k}</div><div class="h1" ${a(.25,.6)}>${t.s1.h}</div>`);
 // 2 문제: 복붙하면 표가 흩어지는 실제 평문 추출
 const lines=demo.plain.split('\n').filter(x=>x.trim()!=='' ).slice(0,13);
 const plain=lines.map((l,i)=>`<div class="pl" data-s="${(.5+i*.16).toFixed(2)}" data-d=".25" ${/^\s/.test(l)||i>=4?'':''}>${esc(l)}</div>`).join('');
 sc(2,`<div class="card"><div class="lab" ${a(0)}>${t.s2.lab}</div><div class="plain">${plain}</div></div><div class="cap" ${a(2.6,.6)}>${t.s2.cap}</div>`);
 // 3 해결: 도구 소개
 sc(3,`<div class="kick" ${a(0)}>${t.s3.k}</div><div class="big" ${a(.3,.7)}>MarkItDown</div><div class="sub" ${a(1.2)}>${t.s3.sub}</div><div class="chips">${t.s3.chips.map((c,i)=>`<div class="chip ${i==0?'a':''}" ${a(2+i*.35,.4)}>${c}</div>`).join('')}</div><div class="cap" ${a(4.2,.6)}>${t.s3.cap}</div>`);
 // 4 설치
 sc(4,`<div class="cap" ${a(0)}><small>${t.s4.k}</small>${t.s4.cap}</div><div class="term" ${a(.3,.5)}><div class="top"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></div><div class="body"><span class="prompt">$ </span><span id="ty4"></span></div></div>`);
 // 5 변환: 실제 실행 결과
 const out=demo.out.split('\n').filter((x,i)=>x!==''||i>0).slice(0,12);
 const outHtml=out.map((l,i)=>`<div class="ol${/^\|/.test(l)?' hl':''}" data-s="${(3+i*.28).toFixed(2)}" data-d=".2">${esc(l)||'&nbsp;'}</div>`).join('');
 sc(5,`<div class="cap" ${a(0)}><small>${t.s5.k}</small>${t.s5.cap}</div><div class="term" ${a(.3,.5)}><div class="top"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></div><div class="body"><span class="prompt">$ </span><span id="ty5"></span>\n${outHtml}</div></div><div class="badge" ${a(3,.4)}>${t.s5.badge}</div>`);
 // 6 지원 형식
 sc(6,`<div class="cap" ${a(0)}><small>${t.s6.k}</small>${t.s6.cap}</div><div class="chips">${t.s6.chips.map((c,i)=>`<div class="chip ${i<4?'a':''}" ${a(.5+i*.3,.4)}>${c}</div>`).join('')}</div>`);
 // 7 댓글 유도
 sc(7,`<div class="kick" ${a(0)}>${t.s7.k}</div><div class="steps">${t.s7.steps.map((s,i)=>`<div class="step" ${a(.4+i*.5,.4)}><b>${i+1}</b>${s}</div>`).join('')}</div><div class="kw" ${a(2.2,.5)}>${t.s7.kw}</div><div class="note" ${a(3.2,.5)}>${t.s7.note}</div>`);
 setT(0);
}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=p=>1-Math.pow(1-p,3);
function setT(t){
 document.querySelector('#bar i').style.width=(clamp(t/END)*100)+'%';
 SC.forEach(([s,e],i)=>{
  const el=document.getElementById('sc'+(i+1));if(!el)return;
  const on=t>=s&&t<e;el.style.display=on?'block':'none';if(!on)return;
  const tl=t-s,dur=e-s;
  el.style.opacity=clamp(Math.min(1,(dur-tl)/.3)); // 장면 끝 0.3초 페이드아웃
  el.querySelectorAll('[data-s]').forEach(n=>{
   const p=ease(clamp((tl-parseFloat(n.dataset.s))/parseFloat(n.dataset.d)));
   n.style.opacity=p;n.style.transform=`translateY(${(1-p)*36}px)`;
  });
  const T=TX[LANG],cur=Math.floor(t*2)%2===0?'<span class="cursor"></span>':'';
  const type=(id,txt,t0,cps)=>{const n=document.getElementById(id);if(!n)return;const k=clamp(Math.floor((tl-t0)*cps),0,txt.length);n.innerHTML=esc(txt.slice(0,k))+(k<txt.length||Math.floor(t*2)%2===0?'<span class="cursor"></span>':'')};
  if(i===3)type('ty4',T.s4.cmd,1.0,13);
  if(i===4)type('ty5',T.s5.cmd,1.0,14);
 });
}
</script></body></html>
