# Netlify 배포 설정: 하네스 대시보드와 보고 API (samgukji.netlify.app)
# 헤더·캐시 규칙은 기존 smaGukji 저장소의 netlify.toml 설정을 가져왔다.
#
# 구조
#   Netlify   정적 파일(dist/: 캐릭터 이미지) + Function(/harness, /api/harness/*)
#   Supabase  harness_* 테이블 (CLAUDE.md 2장)
#   인스타 DM 봇  /webhook(Function) + 토큰 갱신(12시간마다 예약 함수). 토큰·중복 방지·집계는 Supabase igbot_* 테이블
#   영상 목록      data/repos.json을 빌드 때 검증해서 함수에 넣는다(저장소에서 고치면 재배포로 반영)
# 기존 상시 서버(Dockerfile/Render)는 더 이상 필요 없다.
#
# 사이트 설정 → Environment variables (Functions·Builds 범위)
#   SUPABASE_URL                https://<프로젝트ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   Secret으로 표시. 브라우저로는 나가지 않는다
#   DASHBOARD_TOKEN             사람용: /harness 로그인 폼에 입력
#   HARNESS_API_TOKEN           에이전트용
#   VERIFY_TOKEN, APP_SECRET    메타 웹훅 확인 토큰·앱 시크릿 (APP_SECRET이 없으면 웹훅은 거부된다)
#   IG_KO_USER_ID, IG_KO_ACCESS_TOKEN (영어 계정이면 IG_EN_*)   접근 토큰은 Secret으로 표시
[build]
  command = "node scripts/netlify-build.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # 우리 허브 웹앱(couple-hub/web)에는 Supabase 프로젝트 주소와 공개용(publishable) 키가 들어 있다.
  # 둘 다 브라우저에 공개되는 값이라 비밀이 아니므로, 이 파일만 비밀값 검사에서 뺀다.
  # 서비스 롤 키 등 진짜 비밀이 다른 파일에 들어가면 계속 빌드가 막힌다.
  SECRETS_SCAN_OMIT_PATHS = "couple-hub/web/index.html"

[functions]
  node_bundler = "esbuild"

# 캐릭터 이미지는 파일 이름이 바뀌지 않으므로 하루만 캐시한다(서버의 /assets/char 응답과 같다).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
