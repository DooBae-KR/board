# Render 배포 설정: 저장소 연결 후 "Blueprint"로 생성. 값이 sync:false인 항목은 대시보드에서 직접 입력.
services:
  - type: web
    name: repo-dm-bot
    runtime: docker
    plan: starter            # 디스크 사용을 위해 유료 플랜 필요 (토큰 갱신본 보존)
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: TOKENS_FILE, value: /data/tokens.json }
      - { key: REPOS_FILE, value: /data/repos.json }
      - { key: REPOS_SYNC_REPO, value: DooBae-KR/board }
      - { key: GITHUB_TOKEN, sync: false }   # 비공개 저장소일 때만 필요 (읽기 전용)
      - { key: VERIFY_TOKEN, sync: false }
      - { key: APP_SECRET, sync: false }
      - { key: DASHBOARD_TOKEN, sync: false }
      - { key: IG_KO_USER_ID, sync: false }
      - { key: IG_KO_ACCESS_TOKEN, sync: false }
      - { key: IG_EN_USER_ID, sync: false }
      - { key: IG_EN_ACCESS_TOKEN, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }   # 서버 전용. 에이전트에는 주지 않는다
      - { key: HARNESS_API_TOKEN, sync: false }           # 에이전트(Actor)가 /api/harness/report에 쓰는 토큰
