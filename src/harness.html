<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>하네스 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Silkscreen&display=swap">
<script nonce="__NONCE__">try{var c=localStorage.getItem('harness_char');if(c==='sehun')document.documentElement.dataset.char=c}catch(e){}</script>
<style nonce="__NONCE__">
/* Layout: 픽셀 감성 라벤더 콘솔 — 좌측 부서 메뉴(동적) + 우측 12칸 위젯 그리드, 모바일은 상단 가로 메뉴 */
:root{
  --bg:#F2F0FA; --surface:#FFFFFF; --soft:#E8E4F8; --line:#D9D3F1;
  --ink:#2C2852; --muted:#6E6896; --accent:#6F62D2; --accent-ink:#FFFFFF;
  --pink:#EE86AE; --mint:#5DBFA4; --peach:#F0A267; --sky:#6AA8E8; --lilac:#B08AE0;
  --good:#2F9E77; --warn:#C98318; --bad:#D4506A; --loss:#3E78C8;
  --shadow:0 1px 0 #D9D3F1, 0 6px 18px -10px rgba(60,50,130,.28);
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-pixel:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15142A; --surface:#1F1D3A; --soft:#2A2750; --line:#36325F;
  --ink:#EDEBFC; --muted:#A39FCB; --accent:#A79BFF; --accent-ink:#15142A;
  --pink:#F49ABE; --mint:#72D3B8; --peach:#F5B07E; --sky:#82B9F0; --lilac:#C3A2EE;
  --good:#5ACB9E; --warn:#E6AE4E; --bad:#F07A92; --loss:#7FB0F2;
  --shadow:0 1px 0 #2C2950, 0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15142A; --surface:#1F1D3A; --soft:#2A2750; --line:#36325F;
  --ink:#EDEBFC; --muted:#A39FCB; --accent:#A79BFF; --accent-ink:#15142A;
  --pink:#F49ABE; --mint:#72D3B8; --peach:#F5B07E; --sky:#82B9F0; --lilac:#C3A2EE;
  --good:#5ACB9E; --warn:#E6AE4E; --bad:#F07A92; --loss:#7FB0F2;
  --shadow:0 1px 0 #2C2950, 0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark}

/* 캐릭터 테마: 기본(아이유)은 위의 라벤더. 세훈이는 블루 톤으로 바꾼다 */
:root[data-char="sehun"]{--bg:#EEF1FB;--soft:#E0E6F9;--line:#CAD3F0;--ink:#232A52;--muted:#636B9A;--accent:#4C5FD5;--lilac:#7C8FE0;--shadow:0 1px 0 #CAD3F0, 0 6px 18px -10px rgba(40,55,140,.3)}
@media (prefers-color-scheme: dark){:root[data-char="sehun"]:not([data-theme="light"]){--bg:#11172E;--surface:#1A2140;--soft:#242C55;--line:#303A69;--accent:#8EA0FF;--accent-ink:#11172E;--muted:#9FA8D6;--lilac:#A3B1F5}}
:root[data-char="sehun"][data-theme="dark"]{--bg:#11172E;--surface:#1A2140;--soft:#242C55;--line:#303A69;--accent:#8EA0FF;--accent-ink:#11172E;--muted:#9FA8D6;--lilac:#A3B1F5}
.charbox{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px}
.charbox img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;grid-row:span 2}
.charbox small{color:var(--muted);font-size:12px;line-height:1.3}
.chartabs{display:flex;gap:4px}
.chartabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 6px;font-size:12px}
.chartabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100%}

/* 상단 바: 메뉴 버튼 + "어떤 기능을 만들까요?" 검색창 */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 28px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{width:42px;height:42px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-content:center;gap:4px;padding:0}
.burger:hover{background:var(--soft)}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink);transition:transform .2s,opacity .2s}
body.menu-open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
body.menu-open .burger i:nth-child(2){opacity:0}
body.menu-open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* sidebar: 평소엔 숨어 있다가 메뉴 버튼을 누르면 왼쪽에서 나오는 서랍 */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);overflow:auto;z-index:40;transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
body.menu-open .side{transform:none;visibility:visible;transition:transform .22s ease;box-shadow:14px 0 40px -18px rgba(20,18,45,.5)}
.drawer-scrim{position:fixed;inset:0;background:rgba(20,18,45,.42);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
body.menu-open .drawer-scrim{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:44px;height:44px;border-radius:12px;background:var(--soft);object-fit:cover;image-rendering:pixelated}
.brand b{font-family:var(--f-pixel);font-size:17px;letter-spacing:.04em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.menu-label{font-family:var(--f-pixel);font-size:10px;letter-spacing:.14em;color:var(--muted);padding:0 8px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left;color:var(--ink)}
.mi:hover{background:var(--soft)}
.mi[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.mi[aria-current="page"] .cnt{background:rgba(255,255,255,.25);color:inherit}
.mi .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.mi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .cnt{font-family:var(--f-pixel);font-size:10px;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 6px}
/* tree menu */
.menu ul{list-style:none;margin:2px 0 4px 17px;padding:0 0 0 6px;border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:2px}
.caret{width:22px;height:28px;flex:none;border:0;background:none;color:var(--muted);border-radius:6px;display:grid;place-items:center;padding:0}
.caret:hover{background:var(--soft)}
.caret::before{content:"";border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.caret[aria-expanded="true"]::before{transform:rotate(90deg)}
.caret.none{visibility:hidden}
.row .mi{flex:1;min-width:0}
.leaf{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 8px;border-radius:8px;text-align:left;color:var(--muted);font-size:13px}
.leaf:hover{background:var(--soft);color:var(--ink)}
.leaf .wt{flex:none;min-width:30px}
.leaf span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.w.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:inherit}
.crumb button:hover{color:var(--accent)}

/* org tree page */
.orgwrap{overflow-x:auto;padding-bottom:8px}
.org,.org ul{list-style:none;margin:0;padding:0}
.org ul{padding-left:28px;position:relative}
.org li{position:relative;padding:6px 0 6px 22px}
.org li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.org li:last-child::before{bottom:auto;height:34px}
.org li::after{content:"";position:absolute;left:0;top:34px;width:18px;border-top:2px solid var(--line)}
.org>li{padding-left:0}.org>li::before,.org>li::after{display:none}
.onode{display:inline-flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;text-align:left;color:var(--ink);min-width:240px;max-width:100%}
.onode:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.onode img{width:44px;height:44px;border-radius:10px;object-fit:cover;object-position:top;background:var(--soft);flex:none}
.onode b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.2}
.onode small{color:var(--muted);font-size:12px}
.onode.root{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.onode.root small{color:inherit;opacity:.8}
.onode .sw{width:4px;align-self:stretch;border-radius:3px;flex:none}
.wleaf{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);background:var(--bg);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--ink)}
.wleaf:hover{border-color:var(--accent)}
.org li.wl::after{top:22px}.org li.wl:last-child::before{height:22px}
/* agent crew */
.crewhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crewhead h2{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.crewhead small{color:var(--muted)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ag .top{display:flex;gap:12px;align-items:center}
.av{width:58px;height:58px;border-radius:14px;flex:none;position:relative;background:var(--soft);border:3px solid var(--ring,var(--line))}
.av img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:10px;display:block}
.ag .who{min-width:0;flex:1}
.ag .who b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.2}
.model{display:inline-block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;padding:1px 7px;border-radius:5px;color:#fff;margin-top:3px}
.pill{font-size:11px;border-radius:6px;padding:1px 8px;flex:none;align-self:flex-start}
.pill.working{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.waiting{background:var(--soft);color:var(--muted)}
.pill.blocked{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.task{font-size:14.5px;line-height:1.45}
.task small{display:block;color:var(--muted);font-size:12px}
.prog{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.prog .track{height:10px;background:var(--soft);border-radius:3px;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 9px,var(--surface) 9px 10px)}
.prog .fill{height:100%;background:var(--pcol,var(--accent));border-radius:3px;transition:width .4s}
.prog em{font-style:normal;font-family:var(--f-pixel);font-size:11px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.steps li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
.steps li::before{content:"";width:8px;height:8px;border-radius:2px;border:1.5px solid currentColor;flex:none;transform:translateY(1px)}
.steps li.d{text-decoration:line-through;opacity:.7}.steps li.d::before{background:var(--good);border-color:var(--good)}
.steps li.c{color:var(--ink)}.steps li.c::before{background:var(--accent);border-color:var(--accent)}
.ag .foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ag .foot span{flex:1}
.ag.add{align-items:center;justify-content:center;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;font-family:var(--f-display);font-size:16px;min-height:200px}
.ag.add .stack{display:flex}.ag.add .stack img{width:44px;height:44px;border-radius:12px;object-fit:cover;object-position:top;border:2px solid var(--bg);margin-left:-10px;background:var(--soft)}
.ag.flash{animation:flash 1.2s ease}
.avstack{display:flex;align-items:center}
.avstack img{width:28px;height:28px;border-radius:8px;object-fit:cover;object-position:top;border:2px solid var(--surface);margin-left:-6px;background:var(--soft)}
.avstack img:first-child{margin-left:0}
.avstack span{font-size:12px;color:var(--muted);margin-left:8px}
.leaf img{width:18px;height:18px;border-radius:5px;object-fit:cover;object-position:top;flex:none}
.leaf .ln{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf .pct{margin-left:auto;font-family:var(--f-pixel);font-size:9px;flex:none}
.aleaf{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 12px 5px 5px;font-size:13px;color:var(--ink);min-width:220px;text-align:left}
.aleaf:hover{border-color:var(--accent)}
.aleaf img{width:32px;height:32px;border-radius:8px;object-fit:cover;object-position:top;border:2px solid var(--ring,var(--line))}
.aleaf .mini{display:block;width:90px;height:5px;background:var(--soft);border-radius:2px;margin-top:3px;overflow:hidden}
.aleaf .mini i{display:block;height:100%;background:var(--ring,var(--accent))}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1}
.where{display:flex;gap:8px;align-items:center;border:0;background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink);text-align:left}
.where span{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em;color:var(--muted)}
.where:hover{color:var(--accent)}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.linkish:hover{color:var(--accent)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:260px;overflow:auto}
.pick{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;text-align:left}
.pick img{width:40px;height:40px;border-radius:9px;object-fit:cover;object-position:top;flex:none}
.pick b{font-family:var(--f-display);font-weight:400;display:block}
.pick small{color:var(--muted);font-size:12px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:9px;font-family:var(--f-display);font-size:15px}
.add-btn:hover{background:var(--soft)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;position:sticky;bottom:-20px;background:var(--surface);padding:8px 0 20px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;color:var(--ink);font-size:14px}
.ghost:hover{background:var(--soft)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-family:var(--f-display);font-size:15px}
.danger{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:10px;padding:7px 12px}

/* main */
.main{padding-block:24px 48px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-pixel);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted);vertical-align:middle}
.chip.live{color:var(--good)} .chip.live::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--good)}
.chip.idle::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--warn)} .chip.idle{color:var(--warn)}
.chip.sample{border:1px dashed var(--line)}

/* agent strip */
.agent{display:flex;align-items:flex-end;gap:14px;background:var(--soft);border-radius:18px;padding:14px 18px 0;overflow:hidden}
.agent img{width:96px;height:auto;flex:none;image-rendering:auto;margin-bottom:-2px}
.bubble{position:relative;background:var(--surface);border-radius:16px;padding:12px 16px;margin-bottom:18px;max-width:60ch;box-shadow:var(--shadow);min-width:0}
.bubble::before{content:"";position:absolute;left:-7px;bottom:16px;width:14px;height:14px;background:var(--surface);transform:rotate(45deg)}
.bubble b{font-family:var(--f-display);font-weight:400;color:var(--accent)}
.bubble time{display:block;font-family:var(--f-pixel);font-size:10px;color:var(--muted);margin-top:4px}

/* widgets */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.w{grid-column:span 6;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.w.full{grid-column:span 12}.w.third{grid-column:span 4}
.wh{display:flex;align-items:center;gap:8px}
.wh h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0;flex:1;min-width:0}
.wt{font-family:var(--f-pixel);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.wbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.wbtn:hover{background:var(--soft);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--bg);border-radius:12px;padding:12px 14px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi strong{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi strong small{font-size:14px;color:var(--muted);margin-left:2px}
.delta{font-size:12px;font-variant-numeric:tabular-nums}.delta.up{color:var(--bad)}.delta.down{color:var(--good)}.delta.upg{color:var(--good)}.delta.downb{color:var(--bad)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:132px;height:132px;flex:none}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:8px;font-size:14px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums;font-family:var(--f-pixel);font-size:12px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(60px,90px) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px}
.bar .track{height:12px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--accent)}
.bar em{font-style:normal;font-family:var(--f-pixel);font-size:11px;font-variant-numeric:tabular-nums}
.line svg{width:100%;height:150px;display:block}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.list li{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.list .t{flex:1;min-width:0}
.list .t small{display:block;color:var(--muted);font-size:12px}
.st{font-size:11px;border-radius:6px;padding:1px 8px;flex:none}
.st.done{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.st.doing{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.st.todo{background:var(--soft);color:var(--muted)}
.st.risk{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.feed{display:grid;gap:8px;list-style:none;margin:0;padding:0}

.feed time{display:block;font-family:var(--f-pixel);font-size:10px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;background:linear-gradient(160deg,#4A4290,#2B275E);color:#F4F2FF;border-radius:20px;padding:24px 24px 0;overflow:hidden;position:relative}
.hero .copy{padding-bottom:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h1{color:#FFF;font-size:32px}
.hero p{margin:0;color:#D7D2FA;max-width:52ch}
.hero img{width:200px;max-width:100%;border-radius:14px 14px 0 0;display:block}
.stats{display:flex;flex-wrap:wrap;gap:22px}
.stats div{font-family:var(--f-pixel);font-size:10px;letter-spacing:.1em;color:#BDB6F2}
.stats strong{display:block;font-family:var(--f-display);font-size:26px;color:#FFF;letter-spacing:0;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card .top{display:flex;align-items:center;gap:10px}
.card .top img{width:52px;height:52px;object-fit:cover;object-position:top;border-radius:12px;background:var(--soft)}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.card small{color:var(--muted)}
.card .val{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.card .val span{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.card svg{width:100%;height:36px}
.card.add{align-items:center;justify-content:center;border:1.5px dashed var(--accent);color:var(--accent);min-height:160px;font-family:var(--f-display);font-size:17px;background:transparent}
.card.add img{width:72px;opacity:.9}

/* 내 현황 홈 */
.panel{display:flex;flex-direction:column;gap:12px}
.panel>.crewhead h2{font-size:21px}
.panel .grid{gap:14px}
.sns{--sc:var(--accent);position:relative;overflow:hidden}
.sns::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.sns.yt{--sc:#E0524D}.sns.ig{--sc:var(--pink)}
.sns .big{font-family:var(--f-display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.sns .big small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:2px}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}

.gauge .fill{height:100%;border-radius:4px;background:var(--sc);transition:width .5s}

.minis{display:flex;flex-wrap:wrap;gap:8px}
.minis span{background:var(--bg);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--muted)}
.minis b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.nodata{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 16px}
.nodata img{width:72px;flex:none}
.nodata p{margin:0;color:var(--muted);font-size:14px;min-width:0}
.nodata b{color:var(--ink);font-weight:400;font-family:var(--f-display)}
.pulse{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pulse button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.pulse button:hover{border-color:var(--accent)}
.pulse i{width:8px;height:8px;border-radius:2px}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ghead h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.ghead small{color:var(--muted)}
.gap{margin-top:6px}.gap>.ghead{margin-bottom:12px}
.field textarea.plain{font-family:inherit;font-size:inherit;min-height:84px}
.hint2{color:var(--muted);font-size:12px;margin:0}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.alerts li{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;border:1px solid var(--warn);color:var(--warn);background:var(--surface)}
.alerts li.bad{border-color:var(--bad);color:var(--bad);font-weight:700}
.alerts li::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700}
.funnel{grid-column:1/-1}
.funnel table{width:100%;min-width:520px;white-space:nowrap;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.funnel th,.funnel td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
.funnel th:first-child,.funnel td:first-child{text-align:left}
.funnel th{color:var(--muted);font-weight:400;font-size:12px}
.funnel td.err-n{color:var(--bad);font-weight:700}
.funnel .tbl{overflow-x:auto}

.notice{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px 10px 18px;border-radius:16px;font-size:14px;z-index:60;display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100% - 24px))}

.sim{display:grid;gap:8px}
.sim .pick{width:100%}


.pl.up{color:var(--bad)}.pl.down{color:var(--loss)}.pl{font-variant-numeric:tabular-nums}
.dv{position:relative;height:10px;background:var(--soft);border-radius:4px;overflow:hidden}
.dv::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.dv i{position:absolute;top:0;bottom:0}.dv i.up{left:50%;background:var(--bad);border-radius:0 4px 4px 0}.dv i.down{right:50%;background:var(--loss);border-radius:4px 0 0 4px}
.sk-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,1fr) minmax(90px,1fr) minmax(70px,.7fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sk-row.sec{grid-template-columns:minmax(70px,.9fr) minmax(0,2fr) minmax(90px,1fr) minmax(70px,.7fr) minmax(40px,auto)}

.sk-row .r{text-align:right}
.sk-row:first-of-type{border-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:640px){.sk-row,.sk-row.sec{grid-template-columns:minmax(0,1fr) auto}.sk-row .x{grid-column:1/-1}.fgrid{grid-template-columns:1fr}}
.bsel{display:flex;align-items:center;gap:8px}
.bsel select{height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 36px 0 14px;font-family:var(--f-display);font-size:16px}
.cmp{display:grid;gap:14px}
.cmp .rowc{display:grid;grid-template-columns:minmax(64px,90px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.cmp .pair{display:grid;gap:4px}
.cmp .track{height:10px;background:var(--soft);border-radius:4px;overflow:hidden}
.cmp .fill{height:100%;border-radius:4px}
.cmp .fill.b{background:var(--muted);opacity:.55}.cmp .fill.a{background:var(--accent)}
.cmp em{font-style:normal;font-size:12px;font-family:var(--f-pixel);text-align:right;line-height:1.5}
.cmp em b{display:block;font-weight:400;color:var(--good)}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted)}.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

.simgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
.sliders{display:grid;gap:14px}
.sl label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}
.sl label b{font-weight:400;font-family:var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl small{color:var(--muted);font-size:12px}
.simout .big2{font-family:var(--f-display);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.simout .big2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
@media (max-width:820px){.simgrid{grid-template-columns:minmax(0,1fr)}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,45,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.field textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:220px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.poses{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.poses button{border:2px solid transparent;background:var(--soft);border-radius:12px;padding:2px;aspect-ratio:1;overflow:hidden}
.poses img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:9px}
.poses button[aria-pressed="true"]{border-color:var(--accent)}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:9px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin:0}
pre.code{background:var(--bg);border-radius:10px;padding:12px;font-size:12px;overflow-x:auto;margin:0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;z-index:60}

@media (max-width:1000px){.w.third{grid-column:span 6}}
@media (max-width:820px){
  .topbar{padding-inline:16px;gap:8px}
  .main{padding-inline:16px}
  .w,.w.third{grid-column:span 12}
  .hero{grid-template-columns:minmax(0,1fr)}.hero img{width:150px;justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.av video{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.pill.failed{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.stale{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;margin-left:6px}
.conn{font-size:12px;color:var(--muted)}.conn.bad{color:var(--bad)}
.ev{display:grid;gap:6px;list-style:none;margin:0;padding:0;font-size:14px}
.ev li{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:6px 0}
.ev time{font-family:var(--f-pixel);font-size:10px;color:var(--muted);flex:none;min-width:54px}
.ev b{font-weight:400;font-family:var(--f-display)}
.ex{font-family:var(--f-pixel);font-size:9px;border:1px dashed var(--line);border-radius:5px;padding:0 5px;color:var(--muted);margin-left:4px}

.build{flex:1;display:flex;gap:8px;min-width:0;max-width:780px;margin-inline:auto}
.sbox{flex:1;position:relative;min-width:0}
.sbox svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox input{width:100%;height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px 0 40px}
.sbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.build .primary{border-radius:999px;padding:0 18px;height:42px;white-space:nowrap}
@media (max-width:820px){.build .primary{padding:0 12px}.build .ghost{display:none}}
.reqlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}.reqlist li{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface)}.reqlist small{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="burger" id="menuBtn" type="button" aria-expanded="false" aria-controls="side" aria-label="메뉴 열기"><i></i><i></i><i></i></button>
    <form class="build" id="build" role="search" autocomplete="off">
      <div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="buildq" type="text" maxlength="2000" placeholder="Claude Code에 보낼 요청을 적어 주세요. 예: 다음 영상 후보 5개 찾아줘" aria-label="Claude Code 요청"></div>
      <button class="primary" type="submit" id="reqSend">요청 보내기</button>
      <button class="ghost" type="button" id="reqHist">최근 요청</button>
    </form>
  </header>
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="side" id="side" aria-label="메뉴">
    <div class="brand"><img id="brandimg" src="/assets/char/idle.png" alt=""><div><b>HARNESS</b><small>부서별 에이전트 대시보드</small></div></div>
    <div class="menu-label">메뉴</div>
    <ul class="menu" id="menu"></ul>
    <div class="side-foot">
      <div class="charbox" id="charbox"><img id="charimg" src="/assets/char/wave.png" alt="캐릭터">
        <div class="chartabs" role="group" aria-label="캐릭터 테마"><button type="button" data-char="iu" aria-pressed="true">아이유</button><button type="button" data-char="sehun" aria-pressed="false">세훈이</button></div>
        <small id="charline"></small></div>
      <span class="conn" id="conn" role="status">연결 중…</span>
      <button class="ghost" id="logout" type="button">로그아웃</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<script nonce="__NONCE__">
'use strict';
const SPRITES = ['idle','happy','smile','wave','thanks','think','laptop','book','phone','sit','blink','cando','surprised','flustered','sleep'];
const COLORS = {lavender:'var(--accent)',pink:'var(--pink)',mint:'var(--mint)',peach:'var(--peach)',sky:'var(--sky)'};
const SERIES = ['var(--accent)','var(--pink)','var(--mint)','var(--peach)','var(--sky)','var(--lilac)'];
const TYPE_LABEL = {kpi:'지표',donut:'비율',bars:'막대',line:'추이',list:'목록',feed:'에이전트 메시지'};
const TYPE_TAG = {kpi:'KPI',donut:'PIE',bars:'BAR',line:'LINE',list:'LIST',feed:'MSG'};
const ITEM_STATUS = {done:'완료',doing:'진행중',todo:'예정',risk:'주의'};
const AGENT_STATUS = {working:'진행중',waiting:'대기',blocked:'확인 필요',done:'완료',failed:'실패'};
const STATUS_RING = {working:'var(--accent)',waiting:'var(--line)',blocked:'var(--bad)',done:'var(--good)',failed:'var(--bad)'};
const CLIP_FOR = {working:'working',waiting:'idle',done:'done',blocked:'blocked',failed:'blocked'};
const WALK_MS = 60000;
const FALLBACK_COLORS = ['#7A5BC9','#3E83C9','#2C9C7E','#C25A7C','#B8702A','#5868C9','#8A6A3C'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmt = n => typeof n === 'number' ? n.toLocaleString('ko-KR') : esc(n);
const $ = id => document.getElementById(id);
const CHARS = { iu: { dir: '', line: '오늘도 힘내요!' }, sehun: { dir: 'sehun/', line: '안녕! 난 세훈이야! 오늘도 좋은 하루야.' } };
let CHAR = 'iu';
try { const v = localStorage.getItem('harness_char'); if (v && CHARS[v]) CHAR = v; } catch { /* 저장소를 못 쓰면 기본 테마 */ }
const sprite = p => `/assets/char/${CHARS[CHAR].dir}${SPRITES.includes(p) ? p : 'idle'}.png`;
const hex = c => (/^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : null);
const agentColor = a => hex(a.color) || FALLBACK_COLORS[[...a.id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 0) % FALLBACK_COLORS.length];
const ago = iso => { if (!iso) return ''; const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000); if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return Math.floor(s / 86400) + '일 전'; };

const state = { budgetMonth: null, data: { sections: [], widgets: [], agents: [], events: [], tasks: [] }, loaded: false, active: 'overview', filter: 'all', agentView: 'status', etag: null, igbot: null };
const sec = id => state.data.sections.find(s => s.id === id);
const kids = pid => state.data.sections.filter(s => (s.parent_id || null) === pid || (pid === null && s.parent_id && !sec(s.parent_id)));
const agentsIn = sid => state.data.agents.filter(a => a.section_id === sid);
const lobby = () => state.data.agents.filter(a => !a.section_id || !sec(a.section_id));
const widgetsOf = sid => state.data.widgets.filter(w => w.section_id === sid);
const ancestors = s => { const out = []; let p = s.parent_id && sec(s.parent_id); while (p && out.length < 20) { out.unshift(p); p = p.parent_id && sec(p.parent_id); } return out; };
const secPath = s => s ? ancestors(s).map(a => a.name).concat(s.name).join(' › ') : '대기실';
const descendantIds = id => { const out = new Set([id]); let grew = true; while (grew) { grew = false; state.data.sections.forEach(s => { if (s.parent_id && out.has(s.parent_id) && !out.has(s.id)) { out.add(s.id); grew = true; } }); } return out; };
const pct = a => Math.max(0, Math.min(100, Math.round(num(a.progress))));
const stepInfo = a => { const s = a.steps || []; const i = s.findIndex(x => !x.done); return { i, n: s.length, done: s.filter(x => x.done).length }; };

/* ---------- API ---------- */
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || `요청 실패 (${res.status})`);
  return out;
}
// 변화가 없으면 간격을 늘린다(5초 → 최대 60초). 서버리스 호출 수를 아끼기 위해서다.
let pollMs = 5000, pollTimer = null;

const wake = () => { pollMs = 5000; schedule(); };
async function poll() {
  if (document.hidden) return;
  try {
    const res = await fetch('/api/harness', { headers: state.etag ? { 'If-None-Match': state.etag } : {} });
    if (res.status === 304) { pollMs = Math.min(60000, Math.round(pollMs * 1.5)); setConn(true); return; }
    pollMs = 5000;
    if (res.status === 403) { location.reload(); return; } // 세션이 끝났으면 로그인 폼이 뜬다
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || String(res.status));

function donutSVG(items) {
  const total = items.reduce((a, b) => a + num(b.value), 0) || 1; let acc = 0; const r = 48, c = 2 * Math.PI * r;
  const segs = items.map((it, i) => { const len = num(it.value) / total * c; const s = `<circle cx="66" cy="66" r="${r}" fill="none" stroke="${SERIES[i % SERIES.length]}" stroke-width="22" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 66 66)"/>`; acc += len; return s; }).join('');
  return `<svg viewBox="0 0 132 132" role="img" aria-label="비율 차트"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--soft)" stroke-width="22"/>${segs}<text x="66" y="62" text-anchor="middle" fill="var(--muted)" font-size="10">합계</text><text x="66" y="80" text-anchor="middle" fill="var(--ink)" font-size="16">${fmt(Math.round(total * 10) / 10)}</text></svg>`;
}
function lineSVG(labels, values, color, mini) {

  const max = Math.max(...values), min = Math.min(0, ...values), top = max === min ? min + 1 : max;
  const x = i => pl + (values.length === 1 ? 0 : i * (W - pl - pr) / (values.length - 1));
  const y = v => pt + (1 - (v - min) / (top - min)) * (H - pt - pb);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  let grid = '';
  if (!mini) {
    for (let k = 0; k <= 2; k++) { const v = min + (top - min) * k / 2, yy = y(v); grid += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(v * 10) / 10)}</text>`; }
    grid += (Array.isArray(labels) ? labels : []).slice(0, values.length).map((l, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(l)}</text>`).join('');
  }
  const li = values.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="추이 차트">${grid}<polygon points="${x(0)},${H - pb} ${pts} ${x(li)},${H - pb}" fill="${color}" opacity=".14"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${mini ? '' : `<circle cx="${x(li)}" cy="${y(values[li])}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`}</svg>`;
}

function render() {
  const m = $('main'), keepY = window.scrollY;

  else if (state.active === 'stocks') m.innerHTML = stocksHTML();

function go(id, jump) {

function openModal(html, onMount) {

const pressGroup = (root, sel) => root.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => { root.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); }));

/* ---------- Claude Code 요청: 입력을 루틴(API 트리거)으로 보내 새 Claude Code 세션을 시작한다 ----------
   루틴 토큰은 서버 환경변수에만 있고 브라우저는 /api/harness/request만 부른다. 보낸 기록은 이 브라우저에만 남는다(최대 20개). */
const REQ_KEY = 'harness.requests';
const loadReqs = () => { try { return JSON.parse(localStorage.getItem(REQ_KEY) || '[]'); } catch { return []; } };
const saveReq = r => { try { localStorage.setItem(REQ_KEY, JSON.stringify([r, ...loadReqs()].slice(0, 20))); } catch { /* 저장할 수 없어도 요청은 이미 갔다 */ } };
const sessionLink = url => (typeof url === 'string' && url.startsWith('https://claude.ai/') ? `<a href="${esc(url)}" target="_blank" rel="noopener">세션 열기</a>` : '<small>세션 주소를 받지 못했어요 (claude.ai/code에서 확인)</small>');
async function sendRequest(text) {
  const btn = $('reqSend'); btn.disabled = true;
  try {
    const out = await api('POST', '/api/harness/request', { text });
    saveReq({ at: new Date().toISOString(), text: text.slice(0, 200), url: out.sessionUrl || '' });
    $('buildq').value = '';
    openModal(`<h2>Claude Code에 요청을 보냈어요</h2><p>새 세션이 시작됐어요. 작업하는 모습은 에이전트 화면에서 상태로 보이고, 코드를 바꾸면 PR이 열려요(머지는 사람이 해요).</p><p>${sessionLink(out.sessionUrl)}</p><div class="actions"><button type="button" class="ghost" data-close>닫기</button></div>`);
  } catch (e) { toast(e.message); } finally { btn.disabled = false; }
}
function requestHistoryModal() {
  const list = loadReqs();
  openModal(`<h2>최근 요청</h2>${list.length ? `<ul class="reqlist">${list.map(r => `<li>${esc(r.text)}<br><small>${esc(ago(r.at))}</small> ${sessionLink(r.url)}</li>`).join('')}</ul>` : '<p class="empty">이 브라우저에서 보낸 요청이 없어요.</p>'}<div class="actions"><button type="button" class="ghost" data-close>닫기</button></div>`);
}
$('build').addEventListener('submit', e => { e.preventDefault(); const t = $('buildq').value.trim(); if (t) sendRequest(t); });
$('reqHist').addEventListener('click', requestHistoryModal);

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.matches('[data-scrim]') || e.target.closest('[data-close]')) return closeModal();
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'add-section') { setMenu(false); return addSectionModal(null); }
    if (a === 'add-child') return addSectionModal(act.dataset.sid);
    if (a === 'agents-go') { state.filter = act.dataset.v; state.agentView = 'status'; setMenu(false); return go('agents'); }
    if (a === 'agents-dept') { state.filter = 'all'; state.agentView = 'dept'; setMenu(false); return go('agents'); }
    if (a === 'agent-view') { state.agentView = act.dataset.v; return render(); }
    if (a === 'stock-add') return stockModal(null);
    if (a === 'stock-edit') { const h = (state.data.holdings || []).find(x => x.id === act.dataset.hid); return h && stockModal(h); }
    if (a === 'sim-reset') { state.sim = { ...SIM_DEFAULT }; return render(); }
    if (a === 'flt') { state.filter = act.dataset.v; return render(); }
    if (a === 'del-section') { const s = sec(act.dataset.sid); return s && delSectionModal(s); }
  }
  const nav = e.target.closest('[data-nav]'); if (nav) { setMenu(false); go(nav.dataset.nav, nav.dataset.jump); }
});
function applyChar(next, rerender = true) {
  CHAR = CHARS[next] ? next : 'iu';
  document.documentElement.dataset.char = CHAR;
  try { localStorage.setItem('harness_char', CHAR); } catch { /* 저장 실패는 무시 */ }
  $('brandimg').src = sprite('idle'); $('charimg').src = sprite('wave'); $('charline').textContent = CHARS[CHAR].line;
  document.querySelectorAll('#charbox [data-char]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.char === CHAR)));
  if (rerender) render();
}
$('charbox').addEventListener('click', e => { const b = e.target.closest('[data-char]'); if (b) applyChar(b.dataset.char); });
applyChar(CHAR, false);
$('logout').addEventListener('click', async () => { try { await fetch('/harness/logout', { method: 'POST' }); } finally { location.reload(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); setMenu(false); }
});
/* 메뉴 서랍: 버튼을 눌렀을 때만 보인다 */
function setMenu(open) {
  if (document.body.classList.contains('menu-open') === open) return;
  document.body.classList.toggle('menu-open', open);
  const b = $('menuBtn'); b.setAttribute('aria-expanded', String(open)); b.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  if (open) $('side').querySelector('.mi')?.focus();
}
$('menuBtn').addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
$('drawerScrim').addEventListener('click', () => setMenu(false));
document.addEventListener('input', e => { const k = e.target.dataset?.sim; if (!k) return; simParams()[k] = Number(e.target.value); simRefresh(); });
document.addEventListener('change', e => { if (e.target.id === 'b-month') { state.budgetMonth = e.target.value; render(); $('b-month')?.focus(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); wake(); } });
document.addEventListener('click', () => { pollMs = 5000; });

state.active = decodeURIComponent(location.hash.slice(1)) || 'overview';
render(); poll(); schedule(); loadIgbot(); setInterval(() => { if (!document.hidden) loadIgbot(); }, 60000);
</script>
</body>
</html>
